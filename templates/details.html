<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Session Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Menu</h2>

        <a href="/details"><button class="active">Details</button></a>
             <button class="back-btn" onclick="window.history.back()">
                <span>⬅</span> Back
            </button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">
        <div class="container">

            <!-- ✅ STYLED BACK BUTTON -->
     

            <h1>Hello {{ name }} 👋</h1>
<h3>Session Details</h3>
            <!-- USER HISTORY -->
<div class="grid">

    <div class="card">
        <h2>Total Sessions</h2>
        <div class="value">{{ total_sessions }}</div>
    </div>

    <div class="card">
        <h2>Average Stress</h2>
        <div class="value">{{ avg_stress }}</div>
    </div>

</div>

<h3>Recent Sessions</h3>

<div class="grid">
    {% if daily_data %}
        {% for session in daily_data %}
        <div class="card">
            <h4>{{ session[0][:16] }}</h4>
            <p>Avg Stress: {{ session[1] }}</p>
        </div>
        {% endfor %}
    {% else %}
        <p style="text-align:center; width:100%;">No session history yet</p>
    {% endif %}
</div>


        </div>
    </div>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
