<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OTP Verification</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Card */
.card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 40px;
    width: 350px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

/* Title */
h1 {
    color: #e5e7eb;
    margin-bottom: 10px;
}

/* Subtitle */
.subtitle {
    color: #9ca3af;
    font-size: 14px;
    margin-bottom: 25px;
}

/* OTP Input */
input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 18px;
    text-align: center;
    letter-spacing: 4px;
}

input::placeholder {
    color: #9ca3af;
    letter-spacing: normal;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #16a34a;
}

/* Email highlight */
.email {
    color: #22c55e;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="card">
    <h1>Verify OTP</h1>
    <p class="subtitle">
        OTP sent to <span class="email">{{email}}</span>
    </p>

    <form method="POST" action="/verify_otp">
        <input name="otp" placeholder="Enter OTP" maxlength="6" required>
        <button type="submit">Verify</button>
    </form>
</div>

</body>
</html>
