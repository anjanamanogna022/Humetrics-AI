<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass Card */
.card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 40px;
    width: 350px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

/* Title */
h1 {
    color: #e5e7eb;
    margin-bottom: 20px;
}

/* Inputs */
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 14px;
}

input::placeholder {
    color: #9ca3af;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #16a34a;
}

/* Subtitle */
.subtitle {
    color: #9ca3af;
    font-size: 14px;
    margin-bottom: 20px;
}
</style>

</head>
<body>

<div class="card">
    <h1>Humetrics AI </h1>
    <p class="subtitle">Login to start your session</p>

    <form method="POST" action="/send_otp">
        <input name="name" placeholder="Enter Name" required>
        <input name="email" placeholder="Enter Email" required>
        <button type="submit">Send OTP</button>
    </form>
</div>

</body>
</html>
